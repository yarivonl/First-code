<title>צובעים בקסם</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-screen tablet app. Home = sticker-card gallery; paint = tools | drawing | palette (side columns in landscape, stacked in portrait). Single bright look on purpose. */
:root {
  --paper: #fff7e8;
  --paper-dot: #f6e4c4;
  --ink: #2b2140;
  --sun: #ffd93d;
  --mint: #7ee0c3;
  --rose: #ff6fb5;
  --card-castle: #ffd6ec;
  --card-animal: #ffe3b0;
  --card-space: #d3dbff;
  --card-sea: #c4efec;
  --white: #ffffff;
  --danger: #ff4d4d;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
  color: var(--ink);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--rose); outline-offset: 3px; }

/* shared drawing styles */
.r { fill: var(--white); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; }
.d { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.k { fill: var(--ink); pointer-events: none; }
.w { fill: var(--white); pointer-events: none; }
.r.pop { animation: pop .28s ease-out; }
@keyframes pop { 45% { transform: scale(1.05); } }

/* chunky sticker button */
.btn {
  width: 64px; height: 64px; flex: none;
  border-radius: 22px;
  border: 4px solid var(--ink);
  background: var(--white);
  box-shadow: 0 6px 0 var(--ink);
  display: grid; place-items: center;
  padding: 0;
  transition: transform .08s, box-shadow .08s, background .2s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn svg { width: 34px; height: 34px; }
.btn.yellow { background: var(--sun); }
.btn.mint { background: var(--mint); }
.btn.armed { background: var(--danger); animation: wiggle .4s infinite; }
.btn.off { opacity: .55; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

/* home */
#home { height: 100%; display: flex; flex-direction: column; gap: 14px; }
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { height: 72px; width: auto; flex: none; }
.gallery {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(min(170px, 42vw), 1fr));
  align-content: start;
  padding: 6px 4px 18px;
}
.card {
  position: relative;
  aspect-ratio: 1; max-width: 100%;
  border-radius: 30px;
  border: 4px solid var(--ink);
  box-shadow: 0 8px 0 var(--ink);
  padding: 10px;
  transition: transform .1s, box-shadow .1s;
}
.card:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.card svg { width: 100%; height: 100%; display: block; }
.card .badge {
  position: absolute; top: -14px; right: -10px; width: 52px; height: 52px;
  filter: drop-shadow(0 3px 0 var(--ink));
}
.t-castle { background: var(--card-castle); }
.t-animal { background: var(--card-animal); }
.t-space { background: var(--card-space); }
.t-sea { background: var(--card-sea); }

/* paint */
#paint {
  height: 100%;
  display: grid; gap: 12px;
  grid-template-areas: "tools" "stage" "pal";
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.tools { grid-area: tools; display: flex; gap: 12px; align-items: center; }
.tools .spacer { flex: 1; }
.stage { grid-area: stage; min-height: 0; display: grid; place-items: center; touch-action: none; }
.stage svg {
  width: 100%; height: 100%; max-width: 100%;
  overflow: hidden;
  filter: drop-shadow(0 8px 0 var(--ink));
}
.pal {
  grid-area: pal;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  padding-bottom: 6px;
}
.sw {
  width: 54px; height: 54px; flex: none; padding: 0;
  border-radius: 50%;
  border: 4px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .15s;
  display: grid; place-items: center;
}
.sw svg { width: 30px; height: 30px; }
.sw.on { transform: scale(1.22) translateY(-4px); box-shadow: 0 0 0 4px var(--white), 0 0 0 8px var(--ink); }

@media (orientation: landscape) and (min-width: 700px) {
  #paint {
    grid-template-areas: "tools stage pal";
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
  }
  .tools { flex-direction: column; }
  .pal { display: grid; grid-template-columns: repeat(3, 54px); align-content: center; gap: 12px; padding: 0 8px; }
}

/* effects */
.spark { position: fixed; width: 22px; height: 22px; pointer-events: none; z-index: 20; animation: fly .6s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(180deg); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* "alive" celebration: each drawing's groups carry their own pivot via inline transform-origin */
g[class^="a-"] { transform-box: view-box; }
.alive .a-pulse { animation: pulse .7s ease-in-out infinite alternate; }
.alive .a-drift { animation: drift 2.4s ease-in-out infinite alternate; }
.alive .a-flag { animation: flag .3s ease-in-out infinite alternate; }
.alive .a-beat { animation: beat .6s ease-in-out infinite; }
.alive .a-tw { animation: tw .8s ease-in-out infinite alternate; }
.alive .a-bob { animation: bob .6s ease-in-out infinite alternate; }
.alive .a-flicker { animation: flicker .4s steps(2) infinite; }
.alive .a-tail { animation: wag .32s ease-in-out infinite alternate; }
.alive .a-head { animation: tilt 1.1s ease-in-out infinite alternate; }
.alive .a-blink { animation: blink 1.8s infinite; }
.alive .a-sway { animation: sway 1.3s ease-in-out infinite alternate; }
.alive .a-sway2 { animation: sway 1.3s ease-in-out infinite alternate-reverse; }
.alive .a-fly { animation: hover 1.4s ease-in-out infinite alternate; }
.alive .a-wing { animation: flap .2s ease-in-out infinite alternate; }
.alive .a-flame { animation: flame .1s linear infinite alternate; }
.alive .a-launch { animation: launch 3.6s both; }
.alive .a-float { animation: float 1.5s ease-in-out infinite alternate; }
.alive .a-jump { animation: jump .7s ease-in-out infinite; }
.alive .a-rise { animation: rise 1.2s ease-in infinite; }
.alive .a-swim { animation: swim 2.4s ease-in-out infinite; }
.alive .a-wag { animation: wag .22s ease-in-out infinite alternate; }
.alive .a-wig { animation: wig .45s ease-in-out infinite alternate; }
.alive .a-bob2 { animation: bob2 .9s ease-in-out infinite alternate; }
.alive .a-spin { animation: spin 2s linear infinite; }
@keyframes pulse { to { transform: scale(1.18); } }
@keyframes drift { to { transform: translateX(-34px); } }
@keyframes flag { from { transform: skewY(-14deg); } to { transform: skewY(14deg); } }
@keyframes beat { 30% { transform: scale(1.35); } 60% { transform: scale(1); } }
@keyframes tw { to { transform: rotate(36deg) scale(1.4); } }
@keyframes bob { from { transform: rotate(-4deg); } to { transform: translateY(-16px) rotate(4deg); } }
@keyframes flicker { 50% { opacity: 0; } }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
@keyframes tilt { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes blink { 0%, 42%, 52%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }
@keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
@keyframes hover { to { transform: translateY(-28px); } }
@keyframes flap { to { transform: scaleX(.3); } }
@keyframes flame { to { transform: scale(.85, 1.4); } }
@keyframes launch {
  0% { transform: none; } 5% { transform: translateX(-4px); } 10% { transform: translateX(4px); }
  15% { transform: translateX(-4px); } 20% { transform: translateX(4px); } 25% { transform: translateX(-4px); }
  30% { transform: translateX(4px); }
  33% { transform: none; animation-timing-function: ease-in; }
  62% { transform: translateY(-470px); }
  62.5% { transform: translateY(470px); animation-timing-function: ease-out; }
  100% { transform: none; }
}
@keyframes float { to { transform: translate(-8px, 10px) rotate(-12deg); } }
@keyframes jump {
  0%, 100% { transform: none; } 15% { transform: scale(1.15, .85); }
  45% { transform: translateY(-42px) scale(.92, 1.1); } 75% { transform: none; }
}
@keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-45px); opacity: 0; } }
@keyframes swim {
  0%, 100% { transform: none; } 25% { transform: translate(-26px, -10px) rotate(-5deg); }
  50% { transform: none; } 75% { transform: translate(26px, 10px) rotate(5deg); }
}
@keyframes wig { from { transform: rotate(-11deg); } to { transform: rotate(11deg); } }
@keyframes bob2 { to { transform: translateY(-18px); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .r.pop, .btn.armed, .spark, .alive g { animation: none !important; }
  .spark { display: none; }
}
</style>

(() => {
  // ---------- drawing helpers ----------
  const f = n => +n.toFixed(1);
  const starD = (cx, cy, R, r = R * 0.45, n = 5) => {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R;
      d += (i ? 'L' : 'M') + f(cx + rr * Math.cos(a)) + ' ' + f(cy + rr * Math.sin(a));
    }
    return d + 'Z';
  };
  const P = d => `<path class="r" d="${d}"/>`;
  const C = (x, y, r) => `<circle class="r" cx="${x}" cy="${y}" r="${r}"/>`;
  const E = (x, y, rx, ry) => `<ellipse class="r" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
  const B = (x, y, w, h, rx = 0) => `<rect class="r" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
  const S = (x, y, R, r) => P(starD(x, y, R, r));
  const L = d => `<path class="d" d="${d}"/>`;
  const K = (x, y, r) => `<circle class="k" cx="${x}" cy="${y}" r="${r}"/>`;
  const W = (x, y, r) => `<circle class="w" cx="${x}" cy="${y}" r="${r}"/>`;
  const BG = `<rect class="r bg" x="2" y="2" width="396" height="396" rx="26"/>`;

  const flower = (x, y) => L(`M${x} ${y + 18} V352`) +
    [0, 72, 144, 216, 288].map(a => C(f(x + 17 * Math.cos(a * Math.PI / 180)), f(y + 17 * Math.sin(a * Math.PI / 180)), 13)).join('') + C(x, y, 11);

  // ---------- the drawings (all original). Region order must stay stable: saved fills are stored by index. ----------
  const G = (cls, inner, ox, oy, extra = '') => `<g class="${cls}" style="transform-origin:${ox}px ${oy}px;${extra}">${inner}</g>`;
  const TW = (x, y, R, r, i = 0) => G('a-tw', S(x, y, R, r), x, y, `animation-delay:${i * -0.3}s`);

    { id: 'crown', t: 'castle', svg:
      BG + TW(62, 70, 28, undefined, 0) + TW(340, 66, 22, undefined, 1) + TW(344, 332, 20, undefined, 2) + TW(56, 336, 22, undefined, 3) +
      G('a-bob',
        P('M80 290 L62 140 L135 205 L200 110 L265 205 L338 140 L320 290Z') +
        C(62, 134, 14) + C(200, 104, 16) + C(338, 134, 14) +
        P('M200 158 L222 198 L200 238 L178 198Z') + C(126, 242, 13) + C(274, 242, 13) +
        B(70, 270, 260, 50, 14) + C(200, 295, 15) + E(134, 295, 19, 11) + E(266, 295, 19, 11), 200, 300) +
      G('a-flicker', L('M118 92 v18 M109 101 h18 M282 92 v18 M273 101 h18 M200 340 v18 M191 349 h18'), 200, 200)
    },

    },
    { id: 'fish', t: 'sea', svg:
      BG + ground(340, 325, 342) +
      G('a-sway', P('M40 345 Q20 300 45 260 Q65 220 45 180 Q72 210 66 260 Q50 300 62 345Z'), 52, 345) +
      G('a-sway2', P('M350 345 Q330 300 352 270 Q370 240 355 210 Q386 240 376 275 Q362 305 372 345Z'), 360, 345) +
      G('a-rise', C(62, 90, 12) + C(88, 56, 8), 75, 70) + G('a-rise', C(330, 80, 10) + C(312, 50, 6), 320, 65, 'animation-delay:-.6s') +
      G('a-swim',
        G('a-wag', P('M285 190 L362 125 Q345 190 362 255Z'), 288, 190) +
        P('M140 130 Q195 55 255 130Z') + P('M165 255 Q195 305 228 258Z') +
        E(190, 190, 110, 75) +
        P('M150 122 Q130 190 150 258 L175 262 Q155 190 175 118Z') +
        P('M220 120 Q200 190 220 260 L243 255 Q223 190 243 125Z') +
        P('M178 195 Q212 205 206 238 Q184 228 178 195Z') +
        C(122, 172, 17) + K(125, 174, 8) + W(128, 170, 3) + L('M86 205 Q97 214 108 206'), 190, 190)
    },
    { id: 'octopus', t: 'sea', svg:
      BG + ground(342, 328, 344) +
      P('M30 378 Q55 330 80 378Z') + L('M55 376 V346 M42 376 L48 352 M68 376 L62 352') + G('a-spin', S(345, 362, 26, 12), 345, 362) +
      G('a-rise', C(322, 90, 15) + C(346, 52, 10) + C(298, 52, 7), 322, 70) + G('a-rise', C(70, 70, 10), 70, 70, 'animation-delay:-.5s') +
      G('a-bob2',
        G('a-wig', P('M135 215 Q110 270 70 285 Q55 300 80 305 Q135 295 160 225Z'), 148, 220) +
        G('a-wig', P('M265 215 Q290 270 330 285 Q345 300 320 305 Q265 295 240 225Z'), 252, 220, 'animation-delay:-.25s') +
        G('a-wig', P('M165 222 Q150 290 130 330 Q125 350 145 345 Q180 300 190 225Z'), 178, 224, 'animation-delay:-.15s') +
        G('a-wig', P('M235 222 Q250 290 270 330 Q275 350 255 345 Q220 300 210 225Z'), 222, 224, 'animation-delay:-.4s') +
        G('a-wig', P('M188 225 Q195 300 200 352 Q205 300 212 225Z'), 200, 225, 'animation-delay:-.3s') +
        P('M115 225 C100 60 300 60 285 225Z') +
        C(200, 132, 12) + C(160, 142, 8) + C(240, 142, 8) +
        G('a-blink', E(170, 178, 18, 22) + E(230, 178, 18, 22) + K(172, 182, 9) + K(232, 182, 9) + W(176, 177, 3) + W(236, 177, 3), 200, 178) +
        C(146, 208, 10) + C(254, 208, 10) + L('M184 207 Q200 220 216 207'), 200, 220)
    }
  ];

  // ---------- per-drawing celebration sounds (synthesized, no files) ----------
  const N = (f, at, d = .3, type = 'sine', v = .12) => voice(type, [[0, f], [d, f]], v, at);
  const blub = at => voice('sine', [[0, 180], [.09, 720]], .14, at);
  const SOUNDS = {
    castle: () => {
      [392, 523, 659, 784].forEach((f, i) => voice('square', [[0, f], [i === 3 ? .7 : .15, f]], .07, i * .16, { lp: 2200 }));
      [1047, 1319, 1568, 2093].forEach((f, i) => N(f, 1.1 + i * .12, .6, 'sine', .07));
    },
    crown: () => {
      const run = [1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];
      run.forEach((f, i) => N(f, i * .07, .4, 'sine', .07));
      run.slice().reverse().forEach((f, i) => N(f, 1.1 + i * .07, .4, 'sine', .05));
    },
    cat: () => {
      voice('sawtooth', [[0, 420], [.12, 820], [.45, 520]], .12, 0, { lp: 1600, vib: [6, 15] });
      voice('sawtooth', [[0, 520], [.1, 960], [.4, 620]], .12, .7, { lp: 1700, vib: [6, 15] });
      voice('sawtooth', [[0, 34], [1.4, 30]], .14, 1.4, { lp: 280, vib: [22, 6] });
    },
    butterfly: () => {
      for (let i = 0; i < 12; i++) { const f = 600 + i * 70 + Math.random() * 80; voice('sine', [[0, f], [.12, f * 1.5]], .06, i * .12); }
    },
    rocket: () => {
      N(880, 0, .15, 'square', .05); N(880, .4, .15, 'square', .05); N(880, .8, .15, 'square', .05); N(1760, 1.2, .35, 'square', .05);
      noise(1.2, 2.2, 300, 3200, .3);
      voice('sawtooth', [[0, 70], [2, 38]], .12, 1.2, { lp: 400 });
    },
    planet: () => {
      voice('sine', [[0, 300], [.4, 900], [.9, 350]], .13, 0, { vib: [8, 40] });
      [988, 659, 1319, 784, 1568].forEach((f, i) => N(f, 1.0 + i * .13, .1, 'square', .05));
    },
    fish: () => { [0, .25, .4, .8, 1.0, 1.4, 1.7, 2.1].forEach(blub); },
    octopus: () => {
      voice('sine', [[0, 140], [.25, 560], [.7, 200]], .16, 0, { vib: [12, 60] });
      voice('triangle', [[0, 200], [.25, 720], [.8, 250]], .08, .9, { vib: [12, 80] });
      [1.9, 2.1, 2.4].forEach(blub);
    }
  };

  const COLORS = ['#ff4d4d', '#ff9f1c', '#ffd93d', '#8ae234', '#2fbf71', '#2ec4b6', '#4cc9f0', '#3a6ff7',
    '#8b5cf6', '#c77dff', '#ff6fb5', '#ffc2e2', '#a0673a', '#ffcfa3', '#9aa3b5', '#4a4060',
    'url(#rainbow)', 'url(#dots)', 'url(#gold)', 'magic', '#ffffff'];
  const PLAIN = COLORS.slice(0, 15);
  const NOTES = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];

  // ---------- state ----------
  const KEY = 'kc-v1';
  let st = { fills: {}, done: {}, sound: true };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  let page = null, color = COLORS[10], undo = [], regions = [];
  const $ = id => document.getElementById(id);

  const buildSvg = p => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">${p.svg}</svg>`;
    const svg = wrap.firstChild;
    const fills = st.fills[p.id] || [];
    svg.querySelectorAll('.r').forEach((el, i) => { el.dataset.i = i; if (fills[i]) el.style.fill = fills[i]; });
    return svg;
  };

  // ---------- sound ----------
  let ac = null;
  const audio = () => {
    if (!st.sound) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  const tone = (freq, at = 0, dur = .18, type = 'triangle', vol = .18) => {
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur * .6);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  };
  // pitch glide through [time, freq] points, optional vibrato [rate, depth] and lowpass
  const voice = (type, pts, vol = .15, at = 0, opt = {}) => {
    const a = audio(); if (!a) return;
    try {
      const t0 = a.currentTime + at, end = pts[pts.length - 1][0];
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(pts[0][1], t0);
      pts.slice(1).forEach(([t, f]) => o.frequency.linearRampToValueAtTime(f, t0 + t));
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
      g.gain.setValueAtTime(vol, t0 + Math.max(.03, end * .7)); g.gain.exponentialRampToValueAtTime(.0001, t0 + end);
      if (opt.vib) {
        const l = a.createOscillator(), lg = a.createGain();
        l.frequency.value = opt.vib[0]; lg.gain.value = opt.vib[1];
        l.connect(lg).connect(o.frequency); l.start(t0); l.stop(t0 + end);
      }
      let node = o;
      if (opt.lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = opt.lp; node = o.connect(fl); }
      node.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + end + .05);
    } catch (e) {}
  };
  const noise = (at, dur, f1, f2, vol) => {
    const a = audio(); if (!a) return;
    try {
      const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const t0 = a.currentTime + at, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
      s.buffer = buf; fl.type = 'lowpass';
      fl.frequency.setValueAtTime(f1, t0); fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur * .6);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      s.connect(fl).connect(g).connect(a.destination); s.start(t0); s.stop(t0 + dur);
    } catch (e) {}
  };

  // ---------- effects ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sparks = (x, y, c) => {
    if (reduce) return;
    const fill = c.startsWith('#') ? c : '#ffd93d';
    for (let i = 0; i < 6; i++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 20 20'); s.setAttribute('class', 'spark');
      s.innerHTML = `<path d="${starD(10, 10, 9)}" fill="${fill === '#ffffff' ? '#ffd93d' : fill}" stroke="#2b2140" stroke-width="1.5"/>`;
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 40;
      s.style.left = x - 11 + 'px'; s.style.top = y - 11 + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 650);
    }
  };
  const cv = $('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  const confetti = () => {
    if (reduce) return;
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    for (let i = 0; i < 120; i++) parts.push({
      x: innerWidth / 2, y: innerHeight * .55, vx: (Math.random() - .5) * 16, vy: -8 - Math.random() * 12,
      r: 7 + Math.random() * 9, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      c: PLAIN[i % 12], star: i % 3 === 0, life: 0
    });
    if (!raf) raf = requestAnimationFrame(tick);
  };
  const tick = () => {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      if (p.star) cx.fill(new Path2D(starD(0, 0, p.r))); else cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      cx.restore();
    });
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 240);
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  };

  // ---------- home ----------
  const badge = `<svg class="badge" viewBox="0 0 50 50"><path d="${starD(25, 26, 23, 11)}" fill="#ffd93d" stroke="#2b2140" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
  const renderHome = () => {
    const g = $('gallery'); g.innerHTML = '';
    PAGES.forEach(p => {
      const b = document.createElement('button');
      b.className = 'card t-' + p.t; b.setAttribute('aria-label', p.id);
      b.appendChild(buildSvg(p));
      if (st.done[p.id]) b.insertAdjacentHTML('beforeend', badge);
      b.onclick = () => openPage(p);
      g.appendChild(b);
    });
  };

  // ---------- paint ----------
  const renderPal = () => {
    const pal = $('pal'); pal.innerHTML = '';
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'sw' + (c === color ? ' on' : '');
      b.setAttribute('aria-label', 'צבע ' + (i + 1));
      if (c === 'url(#rainbow)') b.style.background = 'conic-gradient(#ff4d4d,#ff9f1c,#ffd93d,#2fbf71,#4cc9f0,#8b5cf6,#ff4d4d)';
      else if (c === 'url(#dots)') b.style.background = 'radial-gradient(#ff6fb5 30%, transparent 33%) 0 0/16px 16px, #ffc2e2';
      else if (c === 'url(#gold)') { b.style.background = '#ffcf3d'; b.innerHTML = `<svg viewBox="0 0 20 20"><path d="${starD(10, 10, 9, 3.5, 4)}" fill="#fff6c9"/></svg>`; }
      else if (c === 'magic') { b.style.background = '#ffffff'; b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 20 L14 10" stroke="#2b2140" stroke-width="3" stroke-linecap="round"/><path d="${starD(17, 7, 6.5, 2.8)}" fill="#ffd93d" stroke="#2b2140" stroke-width="1.5" stroke-linejoin="round"/></svg>`; }
      else if (c === '#ffffff') { b.style.background = '#ffffff'; b.innerHTML = `<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="9" rx="3" transform="rotate(-30 12 12)" fill="#ffc2e2" stroke="#2b2140" stroke-width="2"/></svg>`; }
      else b.style.background = c;
      b.onclick = () => { color = c; tone(NOTES[i % NOTES.length], 0, .12, 'sine', .12); renderPal(); };
      pal.appendChild(b);
    });
  };

  const persist = () => {
    st.fills[page.id] = regions.map(el => el.style.fill || '');
    save();
  };
  const checkDone = () => {
    const allDone = regions.every(el => el.classList.contains('bg') || (el.style.fill && el.style.fill !== 'rgb(255, 255, 255)' && el.style.fill !== '#ffffff'));
    if (allDone && !st.done[page.id]) { st.done[page.id] = true; save(); setTimeout(celebrate, 250); }
  };

  // the drawing comes alive: CSS animations on its groups + its own sound
  let aliveT = 0;
  function celebrate() {
    if (!page) return;
    confetti();
    const svg = $('stage').querySelector('svg');
    svg.classList.remove('alive'); void svg.getBoundingClientRect(); svg.classList.add('alive');
    clearTimeout(aliveT); aliveT = setTimeout(() => svg.classList.remove('alive'), 6500);
    (SOUNDS[page.id] || (() => {}))();
  }

  const openPage = p => {
    clearTimeout(aliveT);
    page = p; undo = [];
    const stage = $('stage'); stage.innerHTML = '';
    const svg = buildSvg(p); stage.appendChild(svg);
    regions = [...svg.querySelectorAll('.r')];
    svg.addEventListener('pointerdown', e => {
      const el = e.target.closest('.r'); if (!el) return;
      e.preventDefault();
      const c = color === 'magic' ? PLAIN[Math.floor(Math.random() * PLAIN.length)] : color;
      undo.push([[+el.dataset.i, el.style.fill || '']]);
      el.style.fill = c;
      el.classList.remove('pop'); void el.getBBox(); el.classList.add('pop');
      tone(NOTES[Math.floor(Math.random() * NOTES.length)]);
      sparks(e.clientX, e.clientY, c);
      persist(); checkDone();
    });
    $('home').hidden = true; $('paint').hidden = false;
    renderPal();
  };

  $('homeBtn').onclick = () => { tone(392, 0, .15, 'sine'); $('paint').hidden = true; $('home').hidden = false; renderHome(); };
  $('undoBtn').onclick = () => {
    const last = undo.pop(); if (!last) return;
    last.forEach(([i, v]) => { regions[i].style.fill = v; });
    tone(330, 0, .14, 'sine'); persist();
  };
  let armT = 0;
  $('clearBtn').onclick = () => {
    const b = $('clearBtn');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); tone(220, 0, .2, 'square', .06);
      clearTimeout(armT); armT = setTimeout(() => b.classList.remove('armed'), 3000);
      return;
    }
    b.classList.remove('armed'); clearTimeout(armT);
    undo.push(regions.map((el, i) => [i, el.style.fill || '']));
    regions.forEach(el => { el.style.fill = ''; });
    tone(523, 0, .12); tone(392, .1, .12); tone(262, .2, .2);
    persist();
  };
  const paintSound = () => { $('soundBtn').classList.toggle('off', !st.sound); $('waves').style.display = st.sound ? '' : 'none'; };
  $('soundBtn').onclick = () => { st.sound = !st.sound; save(); paintSound(); tone(523); };
  $('partyBtn').onclick = celebrate;
  $('fsBtn').onclick = () => {
    try {
      const d = document;
      if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
      else (d.documentElement.requestFullscreen?.() || Promise.resolve()).catch(() => {});
    } catch (e) {}
  };

  paintSound();
  renderHome();
})();
</script>
