<title>צובעים בקסם</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: one-screen tablet app. Home = sticker-card gallery; paint = tools | drawing | palette (side columns in landscape, stacked in portrait). Single bright look on purpose. */
:root {
  --paper: #fff7e8;
  --paper-dot: #f6e4c4;
  --ink: #2b2140;
  --sun: #ffd93d;
  --mint: #7ee0c3;
  --rose: #ff6fb5;
  --card-castle: #ffd6ec;
  --card-animal: #ffe3b0;
  --card-space: #d3dbff;
  --card-sea: #c4efec;
  --card-sweets: #ffd5c7;
  --card-garden: #d4f2c4;
  --card-princess: #f0d9ff;
  --white: #ffffff;
  --danger: #ff4d4d;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
  color: var(--ink);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--rose); outline-offset: 3px; }

/* shared drawing styles */
.r { fill: var(--white); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; }
.d { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.k { fill: var(--ink); pointer-events: none; }
.d.h { stroke-width: 2.4; }
.fine .r { stroke-width: 2.8; }
.fine .d { stroke-width: 2.8; }
.fine .d.h { stroke-width: 1.8; }
.w { fill: var(--white); pointer-events: none; }
.r.pop { animation: pop .28s ease-out; }
@keyframes pop { 45% { transform: scale(1.05); } }

/* chunky sticker button */
.btn {
  width: 64px; height: 64px; flex: none;
  border-radius: 22px;
  border: 4px solid var(--ink);
  background: var(--white);
  box-shadow: 0 6px 0 var(--ink);
  display: grid; place-items: center;
  padding: 0;
  transition: transform .08s, box-shadow .08s, background .2s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn svg { width: 34px; height: 34px; }
.btn.yellow { background: var(--sun); }
.btn.mint { background: var(--mint); }
.btn.armed { background: var(--danger); animation: wiggle .4s infinite; }
.btn.off { opacity: .55; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

/* home */
#home { height: 100%; display: flex; flex-direction: column; gap: 14px; }
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { height: 72px; width: auto; flex: none; }
.gallery {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(min(170px, 42vw), 1fr));
  align-content: start;
  padding: 6px 4px 18px;
}
.card {
  position: relative;
  aspect-ratio: 1; max-width: 100%;
  border-radius: 30px;
  border: 4px solid var(--ink);
  box-shadow: 0 8px 0 var(--ink);
  padding: 10px;
  transition: transform .1s, box-shadow .1s;
}
.card:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.card svg { width: 100%; height: 100%; display: block; }
.card .badge {
  position: absolute; top: -14px; right: -10px; width: 52px; height: 52px;
  filter: drop-shadow(0 3px 0 var(--ink));
}
.t-castle { background: var(--card-castle); }
.t-animal { background: var(--card-animal); }
.t-space { background: var(--card-space); }
.t-sea { background: var(--card-sea); }
.t-sweets { background: var(--card-sweets); }
.t-garden { background: var(--card-garden); }
.t-princess { background: var(--card-princess); }

/* category tiles: cover drawing + a progress row of stars */
.gallery.cats {
  grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 40px;
  width: 100%; max-width: max(320px, calc((100vh - 250px) * 2 + 66px)); margin-inline: auto; box-sizing: border-box;
}
@media (max-width: 600px) { .gallery.cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card .stars {
  position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%);
  display: flex; gap: 4px; padding: 5px 10px;
  background: var(--white); border: 4px solid var(--ink); border-radius: 999px;
}
.card .stars svg { width: 24px; height: 24px; }
.view { height: 100%; display: flex; flex-direction: column; gap: 14px; }
.view-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cat-icon { width: 72px; height: 72px; border-radius: 22px; border: 4px solid var(--ink); padding: 4px; box-sizing: border-box; }
.cat-icon svg { width: 100%; height: 100%; display: block; }

/* paint */
#paint {
  height: 100%;
  display: grid; gap: 12px;
  grid-template-areas: "tools" "stage" "pal";
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.tools { grid-area: tools; display: flex; gap: 12px; align-items: center; }
.tools .spacer { flex: 1; }
.stage { grid-area: stage; min-height: 0; display: grid; place-items: center; touch-action: none; }
.stage { container-type: size; }
.artbox {
  position: relative; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh);
  background: var(--white); border: 4px solid var(--ink); border-radius: 26px;
  box-shadow: 0 8px 0 var(--ink); overflow: hidden; box-sizing: border-box; touch-action: none;
}
.artbox canvas, .artbox img, .athumb img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lineimg { mix-blend-mode: multiply; pointer-events: none; }
.athumb { position: relative; width: 100%; height: 100%; background: var(--white); border-radius: 18px; overflow: hidden; }
.alive.an-bounce { animation: an-bounce .6s ease-in-out infinite alternate; }
.alive.an-sway { animation: an-sway 1.2s ease-in-out infinite alternate; }
.alive.an-twirl { animation: an-twirl 1.6s ease-in-out infinite; }
.alive.an-dance { animation: an-dance 1.8s ease-in-out infinite; }
@keyframes an-bounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-14px) scale(1.03); } }
@keyframes an-sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes an-twirl { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.05) rotate(2deg); } }
@keyframes an-dance { 0%, 100% { transform: rotate(0) translateX(0); } 25% { transform: rotate(-4deg) translateX(-10px); } 75% { transform: rotate(4deg) translateX(10px); } }
@media (prefers-reduced-motion: reduce) { .alive.an-bounce, .alive.an-sway, .alive.an-twirl, .alive.an-dance { animation: none; } }
.stage svg {
  width: 100%; height: 100%; max-width: 100%;
  overflow: hidden;
  filter: drop-shadow(0 8px 0 var(--ink));
}
.pal {
  grid-area: pal;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  padding-bottom: 6px;
}
.sw {
  width: 54px; height: 54px; flex: none; padding: 0;
  border-radius: 50%;
  border: 4px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .15s;
  display: grid; place-items: center;
}
.sw svg { width: 30px; height: 30px; }
.sw.on { transform: scale(1.22) translateY(-4px); box-shadow: 0 0 0 4px var(--white), 0 0 0 8px var(--ink); }

@media (orientation: landscape) and (min-width: 700px) {
  #paint {
    grid-template-areas: "tools stage pal";
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
  }
  .tools { flex-direction: column; }
  .pal { display: grid; grid-template-columns: repeat(3, 54px); align-content: center; gap: 12px; padding: 0 8px; }
}

/* effects */
.spark { position: fixed; width: 22px; height: 22px; pointer-events: none; z-index: 20; animation: fly .6s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(180deg); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* "alive" celebration: each drawing's groups carry their own pivot via inline transform-origin */
g[class^="a-"] { transform-box: view-box; }
.alive .a-pulse { animation: pulse .7s ease-in-out infinite alternate; }
.alive .a-drift { animation: drift 2.4s ease-in-out infinite alternate; }
.alive .a-flag { animation: flag .3s ease-in-out infinite alternate; }
.alive .a-beat { animation: beat .6s ease-in-out infinite; }
.alive .a-tw { animation: tw .8s ease-in-out infinite alternate; }
.alive .a-bob { animation: bob .6s ease-in-out infinite alternate; }
.alive .a-flicker { animation: flicker .4s steps(2) infinite; }
.alive .a-tail { animation: wag .32s ease-in-out infinite alternate; }
.alive .a-head { animation: tilt 1.1s ease-in-out infinite alternate; }
.alive .a-blink { animation: blink 1.8s infinite; }
.alive .a-sway { animation: sway 1.3s ease-in-out infinite alternate; }
.alive .a-sway2 { animation: sway 1.3s ease-in-out infinite alternate-reverse; }
.alive .a-fly { animation: hover 1.4s ease-in-out infinite alternate; }
.alive .a-wing { animation: flap .2s ease-in-out infinite alternate; }
.alive .a-flame { animation: flame .1s linear infinite alternate; }
.alive .a-launch { animation: launch 3.6s both; }
.alive .a-float { animation: float 1.5s ease-in-out infinite alternate; }
.alive .a-jump { animation: jump .7s ease-in-out infinite; }
.alive .a-rise { animation: rise 1.2s ease-in infinite; }
.alive .a-swim { animation: swim 2.4s ease-in-out infinite; }
.alive .a-wag { animation: wag .22s ease-in-out infinite alternate; }
.alive .a-wig { animation: wig .45s ease-in-out infinite alternate; }
.alive .a-bob2 { animation: bob2 .9s ease-in-out infinite alternate; }
.alive .a-spin { animation: spin 2s linear infinite; }
@keyframes pulse { to { transform: scale(1.18); } }
@keyframes drift { to { transform: translateX(-34px); } }
@keyframes flag { from { transform: skewY(-14deg); } to { transform: skewY(14deg); } }
@keyframes beat { 30% { transform: scale(1.35); } 60% { transform: scale(1); } }
@keyframes tw { to { transform: rotate(36deg) scale(1.4); } }
@keyframes bob { from { transform: rotate(-4deg); } to { transform: translateY(-16px) rotate(4deg); } }
@keyframes flicker { 50% { opacity: 0; } }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
@keyframes tilt { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes blink { 0%, 42%, 52%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }
@keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
@keyframes hover { to { transform: translateY(-28px); } }
@keyframes flap { to { transform: scaleX(.3); } }
@keyframes flame { to { transform: scale(.85, 1.4); } }
@keyframes launch {
  0% { transform: none; } 5% { transform: translateX(-4px); } 10% { transform: translateX(4px); }
  15% { transform: translateX(-4px); } 20% { transform: translateX(4px); } 25% { transform: translateX(-4px); }
  30% { transform: translateX(4px); }
  33% { transform: none; animation-timing-function: ease-in; }
  62% { transform: translateY(-470px); }
  62.5% { transform: translateY(470px); animation-timing-function: ease-out; }
  100% { transform: none; }
}
@keyframes float { to { transform: translate(-8px, 10px) rotate(-12deg); } }
@keyframes jump {
  0%, 100% { transform: none; } 15% { transform: scale(1.15, .85); }
  45% { transform: translateY(-42px) scale(.92, 1.1); } 75% { transform: none; }
}
@keyframes rise { 0% { transform: translateY(30px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-45px); opacity: 0; } }
@keyframes swim {
  0%, 100% { transform: none; } 25% { transform: translate(-26px, -10px) rotate(-5deg); }
  50% { transform: none; } 75% { transform: translate(26px, 10px) rotate(5deg); }
}
@keyframes wig { from { transform: rotate(-11deg); } to { transform: rotate(11deg); } }
@keyframes bob2 { to { transform: translateY(-18px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.alive .a-nod { animation: nod 1.2s ease-in-out infinite alternate; }
.alive .a-wave { animation: wave .5s ease-in-out infinite alternate; }
.alive .a-ear { animation: ear .4s ease-in-out infinite alternate; }
.alive .a-ear2 { animation: ear2 .4s ease-in-out infinite alternate; }
.alive .a-pant { animation: pant .25s ease-in-out infinite alternate; }
.alive .a-hop { animation: hop .7s ease-in-out infinite; }
.alive .a-ufo { animation: ufo 1.2s ease-in-out infinite alternate; }
.alive .a-light { animation: light .3s ease-in-out infinite alternate; }
.alive .a-beam { animation: beam .25s ease-in-out infinite alternate; }
.alive .a-rock { animation: rock 2s ease-in-out infinite alternate; }
.alive .a-drift2 { animation: drift2 2.4s ease-in-out infinite alternate; }
.alive .a-bob3 { animation: bob3 1.2s ease-in-out infinite alternate; }
.alive .a-spout { animation: spout .45s ease-in-out infinite alternate; }
.alive .a-side { animation: side 1.6s ease-in-out infinite alternate; }
.alive .a-snap { animation: snap .25s ease-in-out infinite alternate; }
.alive .a-squash { animation: squash .5s ease-in-out infinite alternate; }
.alive .a-bounce { animation: bounce .5s ease-in-out infinite alternate; }
.alive .a-jelly { animation: jelly .4s ease-in-out infinite alternate; }
.alive .a-drip { animation: drip 1s ease-in infinite; }
.alive .a-roll { animation: roll 2s ease-in-out infinite alternate; }
.alive .a-buzz { animation: buzz 1.6s ease-in-out infinite; }
.alive .a-spin4 { animation: spin 4s linear infinite; }
.alive .a-sway3 { animation: sway3 1s ease-in-out infinite alternate; }
.alive .a-fall { animation: fall 3s infinite; }
.alive .a-crawl { animation: crawl 3s ease-in-out infinite alternate; }
.alive .a-glow { animation: glow .8s ease-in-out infinite alternate; }
.alive .a-rain { animation: rain .8s linear infinite; }
.alive .a-swish { animation: swish .6s ease-in-out infinite alternate; }
.alive .a-ride { animation: ride .3s ease-in-out infinite alternate; }
@keyframes swish { from { transform: skewX(-7deg); } to { transform: skewX(7deg); } }
@keyframes ride { to { transform: translateY(-6px) rotate(1deg); } }
@keyframes nod { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
@keyframes ear { from { transform: rotate(-14deg); } to { transform: rotate(8deg); } }
@keyframes ear2 { from { transform: rotate(14deg); } to { transform: rotate(-8deg); } }
@keyframes pant { to { transform: scaleY(1.35); } }
@keyframes hop {
  0%, 100% { transform: none; } 15% { transform: scale(1.1, .88); }
  45% { transform: translateY(-60px) scale(.94, 1.08); } 75% { transform: none; }
}
@keyframes ufo { from { transform: rotate(-5deg); } to { transform: translateY(-18px) rotate(5deg); } }
@keyframes light { to { transform: scale(1.45); } }
@keyframes beam { to { opacity: .45; } }
@keyframes rock { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes drift2 { to { transform: translateX(30px); } }
@keyframes bob3 { from { transform: rotate(-3deg); } to { transform: translateY(12px) rotate(3deg); } }
@keyframes spout { from { transform: scaleY(.3); } to { transform: scaleY(1.25); } }
@keyframes side { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
@keyframes snap { to { transform: rotate(-22deg); } }
@keyframes squash { from { transform: scale(1.08, .9); } to { transform: scale(.95, 1.08); } }
@keyframes bounce { to { transform: translateY(-24px); } }
@keyframes jelly { from { transform: rotate(-6deg) skewX(4deg); } to { transform: rotate(6deg) skewX(-4deg); } }
@keyframes drip { 70% { transform: translateY(16px) scaleY(1.3); } }
@keyframes roll { from { transform: translateX(-70px) rotate(-90deg); } to { transform: translateX(70px) rotate(90deg); } }
@keyframes buzz {
  0%, 100% { transform: none; } 25% { transform: translate(-60px, -30px) rotate(-10deg); }
  50% { transform: translate(-120px, 10px); } 75% { transform: translate(-50px, 40px) rotate(10deg); }
}
@keyframes sway3 { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes fall {
  0%, 25% { transform: none; animation-timing-function: ease-in; }
  50% { transform: translateY(238px); animation-timing-function: ease-out; }
  58% { transform: translateY(215px); animation-timing-function: ease-in; }
  66%, 100% { transform: translateY(238px); }
}
@keyframes crawl { from { transform: translateX(-30px) scaleX(.97); } to { transform: translateX(30px) scaleX(1.03); } }
@keyframes glow { to { transform: scale(1.05); } }

  .r.pop, .btn.armed, .spark, .alive g { animation: none !important; }

/* ===== Pastel candy theme (illustrated backgrounds + glossy controls). Overrides the base styles above. ===== */
:root {
  --plum: #6b4e8a;
  --gloss: rgba(255, 255, 255, .85);
  --wood-hi: #e9bd88; --wood: #d39a5e; --wood-lo: #a8703c;
}
body {
  background: #cfe6fb url(assets/bg_home_l.webp) center / cover no-repeat fixed;
  color: var(--plum);
}
body.painting { background-image: url(assets/bg_paint_l.webp); background-color: #f3dcf1; }
@media (orientation: portrait) {
  body { background-image: url(assets/bg_home_p.webp); }
  body.painting { background-image: url(assets/bg_paint_p.webp); }
}
.logo { height: 92px; width: auto; filter: drop-shadow(0 6px 8px rgba(107, 78, 138, .25)); }

/* glossy round buttons */
.btn {
  position: relative; width: 70px; height: 70px; border-radius: 50%; border: none;
  --c1: #ffe680; --c2: #ffc93a; --c3: #e3a412;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .1), 0 6px 0 var(--c3), 0 12px 18px rgba(107, 78, 138, .28);
}
.btn::before {
  content: ""; position: absolute; left: 18%; top: 9%; width: 64%; height: 36%; border-radius: 50%;
  background: linear-gradient(180deg, var(--gloss), rgba(255, 255, 255, 0)); pointer-events: none;
}
.btn:active { transform: translateY(5px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .1), 0 1px 0 var(--c3), 0 4px 8px rgba(107, 78, 138, .25); }
.btn svg { width: 34px; height: 34px; position: relative; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .15)); }
.btn svg * { stroke: #fff !important; }
#undoBtn { --c1: #9fd8ff; --c2: #4aa8f5; --c3: #2a7fc8; }
#clearBtn { --c1: #ffb0b8; --c2: #ff6b7d; --c3: #d9425a; }
#soundBtn { --c1: #e2c2ff; --c2: #b07ef0; --c3: #8a55cc; }
#fsBtn { --c1: #b5f2dc; --c2: #5fd6ae; --c3: #33a883; }
.btn.armed { --c1: #ff8a8a; --c2: #ff3b3b; --c3: #b81f1f; background: linear-gradient(180deg, var(--c1), var(--c2)); }
.btn.off { opacity: .6; }

/* category + drawing tiles: glossy candy squares */
.t-princess { --tile-hi: #ffe3f1; --tile: #ffbedd; --tile-lo: #e790bd; }
.t-castle { --tile-hi: #efe6ff; --tile: #d7c6ff; --tile-lo: #a993e4; }
.t-animal { --tile-hi: #fff0db; --tile: #ffd3a3; --tile-lo: #e6a565; }
.t-space { --tile-hi: #e6ecff; --tile: #c3d0ff; --tile-lo: #8d9fe0; }
.t-sea { --tile-hi: #e0fbf8; --tile: #aeeae5; --tile-lo: #6cc2bc; }
.t-sweets { --tile-hi: #ffecec; --tile: #ffc8cd; --tile-lo: #e2959d; }
.t-garden { --tile-hi: #eafbe0; --tile: #c6eeae; --tile-lo: #8cc96c; }
.card {
  border: none; border-radius: 34px; padding: 11%;
  background: linear-gradient(180deg, var(--tile-hi), var(--tile));
  box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .06), inset 0 6px 10px rgba(255, 255, 255, .8), 0 8px 0 var(--tile-lo), 0 18px 26px rgba(107, 78, 138, .22);
}
.card::before {
  content: ""; position: absolute; left: 10%; top: 4%; width: 80%; height: 22%; border-radius: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0)); pointer-events: none; z-index: 1;
}
.card:active { transform: translateY(6px); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .06), 0 2px 0 var(--tile-lo), 0 6px 12px rgba(107, 78, 138, .2); }
.cat-ic { width: 100%; height: 100%; object-fit: contain; display: block; position: relative; filter: drop-shadow(0 8px 8px rgba(107, 78, 138, .22)); }
#catGallery .card { padding: 7%; }
.athumb { border-radius: 24px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .9); }
.card .stars { background: rgba(255, 255, 255, .95); border: none; box-shadow: 0 4px 10px rgba(107, 78, 138, .18); bottom: -18px; z-index: 2; }
.card .badge { filter: drop-shadow(0 4px 6px rgba(107, 78, 138, .3)); z-index: 2; }
.cat-icon { border: none; border-radius: 24px; padding: 6px; background: linear-gradient(180deg, var(--tile-hi), var(--tile)); box-shadow: 0 5px 0 var(--tile-lo), 0 10px 16px rgba(107, 78, 138, .22); }
.cat-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* coloring page as a sheet of paper */
.artbox { border: none; border-radius: 30px; box-shadow: 0 0 0 7px rgba(255, 255, 255, .92), 0 16px 34px rgba(107, 78, 138, .3); }

/* wooden palette with paint pots */
.pal {
  align-self: center; padding: 16px 18px; border-radius: 44px;
  background:
    repeating-linear-gradient(100deg, rgba(255, 255, 255, .06) 0 6px, rgba(0, 0, 0, .03) 6px 14px),
    linear-gradient(160deg, var(--wood-hi), var(--wood));
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, .35), inset 0 -7px 0 rgba(0, 0, 0, .12), 0 6px 0 var(--wood-lo), 0 16px 26px rgba(90, 60, 30, .3);
}
.sw {
  position: relative; border: none; width: 52px; height: 52px;
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18), inset 0 3px 3px rgba(255, 255, 255, .45), 0 4px 0 rgba(110, 70, 30, .45), 0 6px 8px rgba(60, 30, 10, .25);
}
.sw::after {
  content: ""; position: absolute; left: 22%; top: 12%; width: 40%; height: 26%; border-radius: 50%;
  background: rgba(255, 255, 255, .6); pointer-events: none;
}
.sw svg { position: relative; z-index: 1; }
.sw.on { transform: scale(1.22) translateY(-3px); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18), 0 0 0 4px #fff, 0 0 0 8px #ff9fd0, 0 8px 14px rgba(60, 30, 10, .3); }
@media (orientation: landscape) and (min-width: 700px) { .pal { grid-template-columns: repeat(3, 52px); gap: 12px; } }
#catGallery {
  grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px;
  width: 100%; max-width: max(300px, calc(100vh - 150px)); margin-inline: auto; box-sizing: border-box;
}
@media (orientation: portrait) and (min-width: 600px) { .gallery.cats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.pal-tabs { grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; flex-basis: 100%; margin-bottom: 2px; }
.pal-tab {
  width: 50px; height: 50px; border-radius: 50%; border: none; padding: 8px; display: grid; place-items: center;
  background: rgba(255, 255, 255, .35); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .08); opacity: .75; transition: transform .15s;
}
.pal-tab svg { width: 100%; height: 100%; }
.pal-tab.on { background: #fff; opacity: 1; transform: scale(1.08); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .08), 0 4px 0 var(--wood-lo), 0 0 0 3px #ff9fd0; }
@media (orientation: portrait) { .pal-tabs { flex-basis: auto; margin: 0 8px 0 0; } }

/* reward sequence */
.artbox.pop { animation: rw-pop 1s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes rw-pop {
  0% { transform: scale(1); }
  30% { transform: scale(1.05); box-shadow: 0 0 0 7px #fff, 0 0 40px 12px rgba(255, 210, 63, .75); }
  100% { transform: scale(1); }
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; z-index: 3; }
.fx .shine {
  position: absolute; inset: -10% -60%;
  background: linear-gradient(105deg, transparent 44%, rgba(255, 255, 255, .8) 50%, transparent 56%);
  transform: translateX(-70%); animation: rw-shine 1.3s .15s ease-in-out 2;
}
@keyframes rw-shine { to { transform: translateX(70%); } }
.fx .rays {
  position: absolute; left: 50%; top: 50%; width: 110%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 214, 90, .55) 0 9deg, rgba(255, 214, 90, 0) 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 66%); mask: radial-gradient(circle, #000 18%, transparent 66%);
  animation: rw-rays-fade 4.8s .4s ease both, rw-spin 9s linear infinite;
}
@keyframes rw-rays-fade { 0% { opacity: 0; } 14% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
@keyframes rw-spin { to { rotate: 360deg; } }
.artbox .fx .bigstar {
  position: absolute; inset: auto; left: 50%; top: 50%; width: 42%; height: auto; translate: -50% -50%;
  filter: drop-shadow(0 12px 20px rgba(200, 140, 0, .45));
  animation: rw-star 4.8s .4s cubic-bezier(.3, 1.4, .5, 1) both;
}
@keyframes rw-star {
  0% { transform: scale(0) rotate(-220deg); opacity: 0; }
  16% { transform: scale(1.18) rotate(12deg); opacity: 1; }
  24% { transform: scale(1) rotate(0); }
  44% { transform: scale(1.06) rotate(-4deg); }
  58% { transform: scale(1) rotate(3deg); }
  72% { transform: scale(1) rotate(0); opacity: 1; }
  100% { transform: translateY(-140%) scale(.25) rotate(25deg); opacity: 0; }
}
.fx .twk { position: absolute; translate: -50% -50%; transform: scale(0); animation: rw-twinkle 1.2s ease-in-out infinite; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #ffc93a); }
.fx .twk svg, .fx .floaty svg { width: 100%; height: 100%; display: block; }
@keyframes rw-twinkle { 0%, 100% { transform: scale(0) rotate(0); } 50% { transform: scale(1) rotate(90deg); } }
.fx .floaty { position: absolute; bottom: -40px; width: 34px; height: 34px; opacity: 0; animation: rw-float 2.8s ease-out forwards; filter: drop-shadow(0 3px 4px rgba(107, 78, 138, .3)); }
@keyframes rw-float {
  0% { transform: translate(0, 0) scale(.5); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translate(var(--sway), var(--rise)) scale(1.15) rotate(25deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .artbox.pop, .fx .shine, .fx .rays, .fx .twk, .fx .floaty { animation: none; opacity: 0; }
  .fx .bigstar { animation: none; opacity: 1; }
}

.fx { container-type: size; }
/* unicorn fly-by with rainbow trail */
.fx .uniwrap { position: absolute; top: 30%; left: -40%; width: 38%; animation: rw-uni 2.8s .3s cubic-bezier(.45, .05, .55, .95) forwards; }
.artbox .fx .uniwrap img { position: relative; inset: auto; width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 10px rgba(107, 78, 138, .3)); animation: rw-bob .35s ease-in-out infinite alternate; }
.fx .uniwrap .trail {
  position: absolute; right: 72%; top: 34%; height: 30%; width: 400%; border-radius: 999px 0 0 999px; opacity: .9;
  background: linear-gradient(#ff8a8a 0 16.6%, #ffc46b 0 33.3%, #fff27a 0 50%, #9be89b 0 66.6%, #8fd3ff 0 83.3%, #c9a3ff 0);
  animation: rw-fade .9s 3.1s forwards;
}
@keyframes rw-uni { 0% { left: -40%; transform: translateY(0); } 50% { transform: translateY(-18%); } 100% { left: 108%; transform: translateY(4%); } }
@keyframes rw-bob { to { transform: translateY(-6%) rotate(-3deg); } }
@keyframes rw-fade { to { opacity: 0; } }
/* balloons */
.artbox .fx .bal { position: absolute; inset: auto; bottom: -45%; height: auto; animation: rw-bal 3.6s ease-in both; }
@keyframes rw-bal {
  0% { transform: translate(0, 0); }
  80% { transform: translate(var(--sway), calc(var(--rise) * .78)) scale(1); opacity: 1; }
  88% { transform: translate(var(--sway), calc(var(--rise) * .82)) scale(1.3); opacity: 1; }
  100% { transform: translate(var(--sway), calc(var(--rise) * .84)) scale(.1); opacity: 0; }
}
/* fireworks + crown */
.artbox .fx .fwc { position: absolute; inset: 0; width: 100%; height: 100%; }
.fx .rays.late { animation-delay: 2s, 0s; animation-duration: 3.4s, 9s; }
.artbox .fx .crown {
  position: absolute; inset: auto; left: 50%; top: 50%; width: 48%; height: auto; translate: -50% -50%;
  filter: drop-shadow(0 12px 20px rgba(200, 140, 0, .45)); animation: rw-crown 3.6s 2s cubic-bezier(.3, 1.4, .5, 1) both;
}
@keyframes rw-crown {
  0% { transform: translateY(-160%) rotate(-12deg); opacity: 0; }
  22% { transform: translateY(6%) rotate(4deg); opacity: 1; }
  32% { transform: translateY(0) rotate(0); }
  50% { transform: scale(1.08); }
  65% { transform: scale(1); opacity: 1; }
  100% { transform: translateY(-120%) scale(.3); opacity: 0; }
}
/* butterflies */
.fx .bfly { position: absolute; left: 50%; top: 55%; width: 16%; translate: -50% -50%; transform: scale(.2); opacity: 0; animation: rw-bfly 3.6s ease-out forwards; }
.artbox .fx .bfly img { position: relative; inset: auto; width: 100%; height: auto; display: block; animation: rw-flap .18s ease-in-out infinite alternate; filter: drop-shadow(0 6px 8px rgba(107, 78, 138, .3)); }
@keyframes rw-bfly {
  0% { transform: translate(0, 0) scale(.2) rotate(0); opacity: 0; }
  12% { opacity: 1; }
  60% { transform: translate(calc(var(--dx) * .6), calc(var(--dy) * .6)) scale(1) rotate(var(--rot)); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(.9) rotate(calc(var(--rot) * -1)); opacity: 0; }
}
@keyframes rw-flap { from { transform: scaleX(1); } to { transform: scaleX(.35); } }
@media (prefers-reduced-motion: reduce) { .fx .uniwrap, .fx .bal, .fx .crown, .fx .bfly { animation: none; opacity: 0; } }
</style>

<script>
(() => {
  // ---------- drawing helpers ----------
  const f = n => +n.toFixed(1);
  const starD = (cx, cy, R, r = R * 0.45, n = 5) => {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R;
      d += (i ? 'L' : 'M') + f(cx + rr * Math.cos(a)) + ' ' + f(cy + rr * Math.sin(a));
    }
    return d + 'Z';
  };
  const P = d => `<path class="r" d="${d}"/>`;
  const C = (x, y, r) => `<circle class="r" cx="${x}" cy="${y}" r="${r}"/>`;
  const E = (x, y, rx, ry) => `<ellipse class="r" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
  const B = (x, y, w, h, rx = 0) => `<rect class="r" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
  const S = (x, y, R, r) => P(starD(x, y, R, r));
  const L = d => `<path class="d" d="${d}"/>`;
  const T = d => `<path class="d h" d="${d}"/>`;
  const K = (x, y, r) => `<circle class="k" cx="${x}" cy="${y}" r="${r}"/>`;
  const W = (x, y, r) => `<circle class="w" cx="${x}" cy="${y}" r="${r}"/>`;
  const BG = `<rect class="r bg" x="2" y="2" width="396" height="396" rx="26"/>`;
  const ground = (a, b, c) => P(`M2 ${a} Q100 ${b} 200 ${c} T398 ${a - 6} V372 a24 24 0 0 1 -24 24 H26 a24 24 0 0 1 -24 -24Z`);
  const flower = (x, y, bottom = 352) => L(`M${x} ${y + 18} V${bottom}`) +
    [0, 72, 144, 216, 288].map(a => C(f(x + 17 * Math.cos(a * Math.PI / 180)), f(y + 17 * Math.sin(a * Math.PI / 180)), 13)).join('') + C(x, y, 11);
  const pt = (cx, cy, r, a) => f(cx + r * Math.cos(a)) + ' ' + f(cy + r * Math.sin(a));
  const H = (cx, cy, s) => `M${cx} ${cy + s} C${cx - 1.6 * s} ${cy - .2 * s} ${cx - .6 * s} ${cy - 1.4 * s} ${cx} ${cy - .5 * s} C${cx + .6 * s} ${cy - 1.4 * s} ${cx + 1.6 * s} ${cy - .2 * s} ${cx} ${cy + s}Z`;
  const cloud = (x, y, s) => `M${x} ${y} a${16 * s} ${16 * s} 0 0 1 ${8 * s} ${-28 * s} a${22 * s} ${22 * s} 0 0 1 ${40 * s} 0 a${16 * s} ${16 * s} 0 0 1 ${2 * s} ${28 * s}z`;
  const drop = (x, y) => `M${x} ${y} Q${x + 13} ${y + 20} ${x} ${y + 24} Q${x - 13} ${y + 20} ${x} ${y}Z`;
  const band = (r1, r2) => `M${200 - r2} 280 A${r2} ${r2} 0 0 1 ${200 + r2} 280 L${200 + r1} 280 A${r1} ${r1} 0 0 0 ${200 - r1} 280Z`;
  const rays = (cx, cy, r1, r2, n) => [...Array(n)].map((_, i) => { const a = i / n * 2 * Math.PI; return `M${pt(cx, cy, r1, a)} L${pt(cx, cy, r2, a)}`; }).join(' ');
  // pinwheel slices with curved edges: each slice is its own colorable region
  const swirl = (cx, cy, R, n) => [...Array(n)].map((_, k) => {
    const a0 = k * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, tw = .9;
    return P(`M${cx} ${cy} Q${pt(cx, cy, R * .6, a0 + tw)} ${pt(cx, cy, R, a0)} A${R} ${R} 0 0 1 ${pt(cx, cy, R, a1)} Q${pt(cx, cy, R * .6, a1 + tw)} ${cx} ${cy}Z`);
  }).join('');
  const wavy = (cx, cy, R, amp, n, steps = 108) => {
    let d = '';
    for (let i = 0; i <= steps; i++) { const a = i / steps * 2 * Math.PI; d += (i ? 'L' : 'M') + pt(cx, cy, R + amp * Math.sin(n * a), a); }
    return d + 'Z';
  };
  const bumps = (cx, cy, R, n) => {
    const ps = [...Array(n)].map((_, i) => pt(cx, cy, R, i / n * 2 * Math.PI - Math.PI / 2));
    const rb = f(R * Math.sin(Math.PI / n) * 1.15);
    return `M${ps[0]}` + ps.slice(1).concat([ps[0]]).map(p => ` A${rb} ${rb} 0 0 1 ${p}`).join('') + 'Z';
  };

  // ---------- the drawings (all original). Region order must stay stable: saved fills are stored by index. ----------
  const G = (cls, inner, ox, oy, extra = '') => `<g class="${cls}" style="transform-origin:${ox}px ${oy}px;${extra}">${inner}</g>`;
  const TW = (x, y, R, r, i = 0) => G('a-tw', S(x, y, R, r), x, y, `animation-delay:${i * -0.3}s`);
  const PAGES = []; // all pages are illustrated line art (see ART below)

  // ---------- per-drawing celebration sounds (synthesized, no files) ----------
  const N = (f, at, d = .3, type = 'sine', v = .12) => voice(type, [[0, f], [d, f]], v, at);
  const blub = at => voice('sine', [[0, 180], [.09, 720]], .14, at);
  const SOUNDS = {
    castle: () => {
      [392, 523, 659, 784].forEach((f, i) => voice('square', [[0, f], [i === 3 ? .7 : .15, f]], .07, i * .16, { lp: 2200 }));
      [1047, 1319, 1568, 2093].forEach((f, i) => N(f, 1.1 + i * .12, .6, 'sine', .07));
    },
    crown: () => {
      const run = [1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];
      run.forEach((f, i) => N(f, i * .07, .4, 'sine', .07));
      run.slice().reverse().forEach((f, i) => N(f, 1.1 + i * .07, .4, 'sine', .05));
    },
    cat: () => {
      voice('sawtooth', [[0, 420], [.12, 820], [.45, 520]], .12, 0, { lp: 1600, vib: [6, 15] });
      voice('sawtooth', [[0, 520], [.1, 960], [.4, 620]], .12, .7, { lp: 1700, vib: [6, 15] });
      voice('sawtooth', [[0, 34], [1.4, 30]], .14, 1.4, { lp: 280, vib: [22, 6] });
    },
    butterfly: () => {
      for (let i = 0; i < 12; i++) { const f = 600 + i * 70 + Math.random() * 80; voice('sine', [[0, f], [.12, f * 1.5]], .06, i * .12); }
    },
    rocket: () => {
      N(880, 0, .15, 'square', .05); N(880, .4, .15, 'square', .05); N(880, .8, .15, 'square', .05); N(1760, 1.2, .35, 'square', .05);
      noise(1.2, 2.2, 300, 3200, .3);
      voice('sawtooth', [[0, 70], [2, 38]], .12, 1.2, { lp: 400 });
    },
    planet: () => {
      voice('sine', [[0, 300], [.4, 900], [.9, 350]], .13, 0, { vib: [8, 40] });
      [988, 659, 1319, 784, 1568].forEach((f, i) => N(f, 1.0 + i * .13, .1, 'square', .05));
    },
    fish: () => { [0, .25, .4, .8, 1.0, 1.4, 1.7, 2.1].forEach(blub); },
    octopus: () => {
      voice('sine', [[0, 140], [.25, 560], [.7, 200]], .16, 0, { vib: [12, 60] });
      voice('triangle', [[0, 200], [.25, 720], [.8, 250]], .08, .9, { vib: [12, 80] });
      [1.9, 2.1, 2.4].forEach(blub);
    },
    unicorn: () => {
      [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760].forEach((f, i) => N(f, i * .06, .4, 'sine', .06));
      voice('sawtooth', [[0, 600], [.15, 1100], [.8, 450]], .07, 1.0, { lp: 2500, vib: [16, 90] });
    },
    wand: () => {
      voice('sine', [[0, 400], [.5, 2400]], .1);
      for (let i = 0; i < 10; i++) N(1500 + Math.random() * 1500, .5 + i * .09, .2, 'sine', .05);
    },
    dog: () => {
      [0, .35, 1.6].forEach(t => { voice('sawtooth', [[0, 260], [.04, 480], [.16, 220]], .16, t, { lp: 1100 }); noise(t, .12, 1500, 600, .1); });
      [.8, 1.0, 1.2, 1.4].forEach(t => noise(t, .1, 2500, 2000, .05));
    },
    bunny: () => {
      [0, .7, 1.4, 2.1].forEach(t => voice('sine', [[0, 220], [.12, 660], [.25, 330]], .12, t, { vib: [20, 30] }));
      [2.7, 2.85, 3.0].forEach(t => noise(t, .07, 3000, 1500, .1));
    },
    ufo: () => {
      voice('sine', [[0, 500], [.8, 900], [1.6, 450], [2.4, 800]], .1, 0, { vib: [7, 50] });
      [1200, 900, 1500].forEach((f, i) => N(f, 2.5 + i * .15, .1, 'square', .05));
    },

  const buildRegions = gray => {
    const N = gray.length, W = Math.round(Math.sqrt(N)), H = W;

        if (x < W - 1 && !mask[i + 1] && owner[i + 1] < 0) { owner[i + 1] = n; stack[sp++] = i + 1; }
        if (i >= W && !mask[i - W] && owner[i - W] < 0) { owner[i - W] = n; stack[sp++] = i - W; }
        if (i < N - W && !mask[i + W] && owner[i + W] < 0) { owner[i + W] = n; stack[sp++] = i + W; }

      if (x < W - 1 && owner[i + 1] < 0) { owner[i + 1] = o; q[qt++] = i + 1; }
      if (i >= W && owner[i - W] < 0) { owner[i - W] = o; q[qt++] = i - W; }

  };
  const regionCache = {};

  const openArt = async p => {

  };
  const paintRegion = (L, c) => {
    const { R, imgData } = art, d = imgData.data, own = R.owner, fn = colorFn(c, R.W);

  };

  const CATS = [
    { id: 'princess', pages: ['prunicorn', 'prdance', 'prtea', 'prcarriage'] },
    { id: 'castle', pages: ['gcastle', 'gcrown', 'gunicorn', 'gwand'] },
    { id: 'animal', pages: ['gcat', 'gbutterfly', 'gdog', 'gbunny'] },
    { id: 'space', pages: ['grocket', 'gplanet', 'gufo', 'gmoon'] },
    { id: 'sea', pages: ['gfish', 'goctopus', 'gwhale', 'gcrab'] },
    { id: 'sweets', pages: ['gcupcake', 'gicecream', 'glollipop', 'gdonut'] },
    { id: 'garden', pages: ['gflowerpot', 'gtree', 'gsnail', 'grainbow'] }
  ];
  const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));

  const SOLID = ['#ff4d4d', '#ff9f1c', '#ffd93d', '#8ae234', '#2fbf71', '#2ec4b6', '#4cc9f0', '#3a6ff7',
    '#8b5cf6', '#c77dff', '#ff6fb5', '#ffc2e2', '#a0673a', '#ffcfa3', '#9aa3b5', '#4a4060', '#ffffff'];
  const PATTERNS = ['url(#rainbow)', 'url(#dots)', 'url(#gold)', 'pat:stripes', 'pat:hearts', 'pat:stars', 'pat:sunset', 'pat:ocean', 'magic', '#ffffff'];
  const COLORS = SOLID.concat(PATTERNS);
  const PLAIN = SOLID.slice(0, 15);
  const NOTES = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];

  // ---------- state ----------
  const KEY = 'kc-v1';
  let st = { fills: {}, done: {}, sound: true };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  let page = null, color = COLORS[10], undo = [], regions = [];
  const $ = id => document.getElementById(id);

  const buildSvg = p => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"${p.fine ? ' class="fine"' : ''}>${p.svg}</svg>`;
    const svg = wrap.firstChild;
    const fills = st.fills[p.id] || [];
    svg.querySelectorAll('.r').forEach((el, i) => { el.dataset.i = i; if (fills[i]) el.style.fill = fills[i]; });
    return svg;
  };

  // ---------- sound ----------
  let ac = null;
  const audio = () => {
    if (!st.sound) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  const tone = (freq, at = 0, dur = .18, type = 'triangle', vol = .18) => {
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur * .6);

    const a = audio(); if (!a) return;
    try {
      const t0 = a.currentTime + at, end = pts[pts.length - 1][0];
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(pts[0][1], t0);
      pts.slice(1).forEach(([t, f]) => o.frequency.linearRampToValueAtTime(f, t0 + t));
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
      g.gain.setValueAtTime(vol, t0 + Math.max(.03, end * .7)); g.gain.exponentialRampToValueAtTime(.0001, t0 + end);

      node.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + end + .05);

  // ---------- effects ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sparks = (x, y, c) => {
    if (reduce) return;

    for (let i = 0; i < 6; i++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 20 20'); s.setAttribute('class', 'spark');

  const cv = $('confetti'), cx = cv.getContext('2d');

      r: 7 + Math.random() * 9, a: Math.random() * 6, va: (Math.random() - .5) * .3,

  };

  // ---------- home ----------
  const badge = `<svg class="badge" viewBox="0 0 50 50"><path d="${starD(25, 26, 23, 11)}" fill="#ffd23f" stroke="#e0a100" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
  const miniStar = on => `<svg viewBox="0 0 24 24"><path d="${starD(12, 12.5, 11, 5)}" fill="${on ? '#ffd23f' : '#ffffff'}" stroke="${on ? '#e0a100' : '#e8c6dc'}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;

  // ---------- paint ----------
  const TAB_ICONS = {

      else b.style.background = c;

  };

  const persist = () => {
    st.fills[page.id] = regions.map(el => el.style.fill || '');

  const checkDone = () => {
    const allDone = regions.every(el => el.classList.contains('bg') || (el.style.fill && el.style.fill !== 'rgb(255, 255, 255)' && el.style.fill !== '#ffffff'));
    if (allDone && !st.done[page.id]) { st.done[page.id] = true; save(); setTimeout(celebrate, 250); }
  };

  // the drawing comes alive: CSS animations on its groups + its own sound
  let aliveT = 0;
  function celebrate() {
    if (!page) return;
    if (art) { rewardShow(); return; }
    confetti();
    const el = $('stage').querySelector('svg');
    el.classList.remove('alive'); void el.getBoundingClientRect(); el.classList.add('alive');
    clearTimeout(aliveT); aliveT = setTimeout(() => el.classList.remove('alive'), 6500);

  }

  // reward sequences: a different celebration each time (never the same twice in a row)
  let fxT = 0, fwRaf = 0;
  const REWARDS = ['star', 'unicorn', 'balloons', 'fireworks', 'butterflies'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const addTwinkles = (fx, n) => {
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div'), sz = rnd(16, 42);
      s.className = 'twk'; s.style.cssText = `left:${rnd(6, 94)}%;top:${rnd(6, 94)}%;width:${sz}px;height:${sz}px;animation-delay:${rnd(0, 3).toFixed(2)}s`;
      s.innerHTML = `<svg viewBox="0 0 24 24"><path d="${starD(12, 12, 11.5, 2.6, 4)}" fill="#ffe680"/></svg>`;
      fx.appendChild(s);
    }
  };
  const addFloaties = (fx, n, delay = .5) => {
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div'), col = PLAIN[(i * 3) % PLAIN.length];
      h.className = 'floaty'; h.style.cssText = `left:${rnd(4, 94)}%;animation-delay:${(delay + rnd(0, 2.6)).toFixed(2)}s;--sway:${Math.round(rnd(-30, 30))}px`;
      h.innerHTML = i % 2 ? `<svg viewBox="0 0 24 24"><path d="${H(12, 10.5, 8)}" fill="${col}" stroke="#fff" stroke-width="1.5"/></svg>`
                          : `<svg viewBox="0 0 24 24"><path d="${starD(12, 12.5, 11, 5)}" fill="${col}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
      fx.appendChild(h);
    }
  };
  const BUILD = {
    star: fx => {
      fx.insertAdjacentHTML('beforeend', '<div class="rays"></div><img class="bigstar" alt="" src="assets/star.webp">');
      addTwinkles(fx, 18); addFloaties(fx, 16);
    },
    unicorn: fx => {
      fx.insertAdjacentHTML('beforeend', '<div class="uniwrap"><div class="trail"></div><img alt="" src="assets/fx_unicorn.webp"></div>');
      addTwinkles(fx, 14); addFloaties(fx, 14, 2.2);
    },
    balloons: fx => {
      for (let i = 0; i < 10; i++) {
        const b = document.createElement('img'), w = rnd(15, 22);
        b.className = 'bal'; b.alt = ''; b.src = 'assets/fx_balloon.webp';
        b.style.cssText = `left:${(i / 10) * 88 + rnd(-3, 5)}%;width:${w}%;filter:hue-rotate(${Math.round(i * 36 + rnd(0, 20))}deg) saturate(1.2) drop-shadow(0 6px 8px rgba(107,78,138,.25));animation-delay:${rnd(0, 1.1).toFixed(2)}s;--sway:${Math.round(rnd(-40, 40))}px`;
        fx.appendChild(b);
      }
      addTwinkles(fx, 8);
    },
    fireworks: fx => {
      fx.insertAdjacentHTML('beforeend', '<canvas class="fwc"></canvas><div class="rays late"></div><img class="crown" alt="" src="assets/fx_crown.webp">');
      addTwinkles(fx, 10);
    },
    butterflies: fx => {
      for (let i = 0; i < 11; i++) {
        const a = (i / 11) * Math.PI * 2 + rnd(-.2, .2), d = rnd(55, 85);
        const w = document.createElement('div');
        w.className = 'bfly'; w.style.cssText = `--dx:${(Math.cos(a) * d).toFixed(1)}cqw;--dy:${(Math.sin(a) * d - 20).toFixed(1)}cqh;--rot:${Math.round(rnd(-30, 30))}deg;animation-delay:${rnd(0, .9).toFixed(2)}s;filter:hue-rotate(${Math.round(rnd(0, 360))}deg)`;
        w.innerHTML = `<img alt="" src="assets/fx_butterfly.webp" style="animation-duration:${rnd(.14, .22).toFixed(2)}s">`;
        fx.appendChild(w);
      }
      addTwinkles(fx, 26);
    }
  };
  const runFireworks = fx => {
    const cv = fx.querySelector('.fwc'); if (!cv || reduce) return;
    const W = cv.width = fx.clientWidth * devicePixelRatio, Hh = cv.height = fx.clientHeight * devicePixelRatio;
    const ctx = cv.getContext('2d'); let ps = [];
    const burst = () => {
      const x = rnd(.2, .8) * W, y = rnd(.15, .5) * Hh, col = ['#ff6fb5', '#ffd23f', '#4cc9f0', '#8b5cf6', '#2fbf71', '#ff9f1c'][Math.floor(rnd(0, 6))];
      for (let i = 0; i < 70; i++) { const a = rnd(0, Math.PI * 2), v = rnd(2, 7) * devicePixelRatio; ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: Math.random() < .25 ? '#fff' : col }); }
    };
    [150, 800, 1450, 2100, 2750, 3300].forEach(t => setTimeout(burst, t));
    const t0 = performance.now();
    const step = () => {
      ctx.clearRect(0, 0, W, Hh);
      ps.forEach(p => { p.vx *= .97; p.vy = p.vy * .97 + .09 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.life -= .014;
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 3 * devicePixelRatio, 0, 7); ctx.fill(); });
      ps = ps.filter(p => p.life > 0);
      fwRaf = performance.now() - t0 < 5000 && cv.isConnected ? requestAnimationFrame(step) : 0;
    };
    fwRaf = requestAnimationFrame(step);
  };
  const RSOUND = {
    star: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .55 + i * .07, .3, 'sine', .1)); tone(2093, .9, .6, 'sine', .07); },
    unicorn: () => {
      noise(.2, 2.4, 300, 2600, .12);
      [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => N(f, .3 + i * .1, .5, 'sine', .06));
      voice('sawtooth', [[0, 600], [.15, 1100], [.8, 450]], .06, 2.0, { lp: 2500, vib: [16, 90] });
    },
    balloons: () => {
      [0, .3, .6].forEach(t => voice('sine', [[0, 300], [.5, 900]], .06, t));
      for (let i = 0; i < 7; i++) noise(3.0 + i * .12 + rnd(0, .05), .06, 4000, 1500, .25);
    },
    fireworks: () => {
      [150, 800, 1450, 2100, 2750, 3300].forEach(ms => {
        const t = ms / 1000;
        voice('sine', [[0, 500], [.22, 1800]], .03, Math.max(0, t - .25));
        noise(t, .6, 700, 120, .3);
        for (let k = 0; k < 5; k++) noise(t + .2 + k * .06, .03, 6000, 4000, .05);
      });
      [784, 988, 1175, 1568].forEach((f, i) => tone(f, 1.0 + i * .07, .3, 'sine', .08));
    },
    butterflies: () => { for (let i = 0; i < 16; i++) N(rnd(1800, 3200), i * .15 + rnd(0, .05), .12, 'sine', .04); [1047, 1319, 1568].forEach((f, i) => N(f, 2.4 + i * .1, .4, 'triangle', .07)); }
  };
  const rewardShow = () => {
    const box = art.box;
    box.querySelector('.fx')?.remove(); clearTimeout(fxT); cancelAnimationFrame(fwRaf);
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    const pool = REWARDS.filter(r => r !== st.lastReward);
    const kind = pool[Math.floor(Math.random() * pool.length)];
    st.lastReward = kind; save();
    const fx = document.createElement('div'); fx.className = 'fx fx-' + kind;
    fx.style.setProperty('--rise', -(box.clientHeight + 120) + 'px');
    fx.innerHTML = '<div class="shine"></div>';
    BUILD[kind](fx);
    box.appendChild(fx);
    if (kind === 'fireworks') runFireworks(fx);
    RSOUND[kind]();
    if (kind !== 'fireworks') setTimeout(confetti, kind === 'unicorn' ? 2600 : 700);
    setTimeout(() => (SOUNDS[page.sound || page.id] || (() => {}))(), kind === 'fireworks' ? 3600 : 1500);
    fxT = setTimeout(() => { fx.remove(); box.classList.remove('pop'); }, 5800);
  };

  const openPage = p => {
    clearTimeout(aliveT); clearTimeout(fxT); cancelAnimationFrame(fwRaf);
    page = p; undo = []; art = null;
    if (p.art) { openArt(p); show('paint'); renderPal(); return; }
    const stage = $('stage'); stage.innerHTML = '';
    const svg = buildSvg(p); stage.appendChild(svg);
    regions = [...svg.querySelectorAll('.r')];
    svg.addEventListener('pointerdown', e => {
      const el = e.target.closest('.r'); if (!el) return;
      e.preventDefault();
      const c = color === 'magic' ? PLAIN[Math.floor(Math.random() * PLAIN.length)] : color;
      undo.push([[+el.dataset.i, el.style.fill || '']]);
      el.style.fill = c;
      el.classList.remove('pop'); void el.getBBox(); el.classList.add('pop');
      tone(NOTES[Math.floor(Math.random() * NOTES.length)]);
      sparks(e.clientX, e.clientY, c);
      persist(); checkDone();
    });
    show('paint');
    renderPal();
  };

  $('homeBtn').onclick = () => { tone(392, 0, .15, 'sine'); clearTimeout(aliveT); openCat(curCat || CATS.find(c => c.pages.includes(page.id))); };
  $('catHomeBtn').onclick = () => { tone(392, 0, .15, 'sine'); renderHome(); show('home'); };
  $('undoBtn').onclick = () => {
    if (art) return undoArt();
    const last = undo.pop(); if (!last) return;
    last.forEach(([i, v]) => { regions[i].style.fill = v; });
    tone(330, 0, .14, 'sine'); persist();
  };
  let armT = 0;
  $('clearBtn').onclick = () => {
    const b = $('clearBtn');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); tone(220, 0, .2, 'square', .06);
      clearTimeout(armT); armT = setTimeout(() => b.classList.remove('armed'), 3000);
      return;
    }
    b.classList.remove('armed'); clearTimeout(armT);
    if (art) { clearArt(); tone(523, 0, .12); tone(392, .1, .12); tone(262, .2, .2); return; }
    undo.push(regions.map((el, i) => [i, el.style.fill || '']));
    regions.forEach(el => { el.style.fill = ''; });
    tone(523, 0, .12); tone(392, .1, .12); tone(262, .2, .2);
    persist();
  };
  const paintSound = () => { $('soundBtn').classList.toggle('off', !st.sound); $('waves').style.display = st.sound ? '' : 'none'; };
  $('soundBtn').onclick = () => { st.sound = !st.sound; save(); paintSound(); tone(523); };
  $('partyBtn').onclick = celebrate;
  $('fsBtn').onclick = () => {
    try {
      const d = document;
      if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
      else (d.documentElement.requestFullscreen?.() || Promise.resolve()).catch(() => {});
    } catch (e) {}
  };

  paintSound();
  renderHome();
})();
</script>
